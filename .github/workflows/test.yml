name: Test

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'

concurrency:
  group: github-integration-test
  cancel-in-progress: false

# GitHub reserves the GITHUB_ prefix for secret names, hence GH_TOKEN.
env:
  GITHUB_OWNER: ${{ github.repository_owner }}
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TF_INPUT: false
    strategy:
      fail-fast: false
      # Matrix legs share the owner too; run one at a time.
      max-parallel: 1
      matrix:
        module:
          - .
          - modules/rulesets
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Test ${{ matrix.module }}
        run: terraform init && terraform test
        working-directory: ./${{ matrix.module }}
